framework: "net10.0"
overview: "Adds dashboard-configurable Sonarr and Radarr metadata badges to Jellyfin posters, with a read-only diagnostics panel."
description: >
  ArrTags reads metadata from independently configured Sonarr and Radarr
  instances and publishes configurable badges (for example the actual file
  quality) onto Jellyfin Movie and Episode posters through Jellyfin's supported
  item-image APIs, preserving the original poster. It is configured from a
  dashboard settings page that applies most changes to the running plugin
  without a restart, supports a per-selector value allowlist and configurable
  badge size and position (including Extra Large), shows byte-denominated
  limits in a fixed binary unit (MB, or KB for the webhook payload) while the
  saved value stays the exact byte count, marks the restart-required settings,
  bounds log verbosity with a secret-redaction contract, and caches each
  provider library so one read serves a reconciliation window. The same page
  shows a read-only, administrator-only diagnostics panel with bounded counters
  for the current Jellyfin session, and scheduled and post-scan reconciliation
  covers a library larger than the work queue across successive runs.
category: "General"
owner: "arrtags"
artifacts:
  - "ArrTags.dll"
  - "ArrTags.deps.json"
changelog: >
  v1.2 shows byte-denominated limits in binary units (MB, or KB for the webhook
  payload) with the exact byte count persisted and off-step values rejected,
  adds restart-required note text plus a best-effort change reminder for the
  settings that need a host restart (a mixed setting states that some paths
  apply immediately), adds the Extra Large badge size (dropdown order Small,
  Medium, Large, Extra Large), identifies media in log output by a bounded file
  name (with an item-id fallback, never a directory or full path) together with
  the bounded render classification, adds a read-only administrator diagnostics
  panel backed by a bounded, secret-free status endpoint, covers a library
  larger than the work queue across successive scheduled and post-scan
  reconciliation runs through a persisted cursor, re-enqueues the post-save
  re-render of an item whose older-version work was discarded instead of
  dropping it, and restores the original poster when a saved configuration
  narrows an owned item's badge selection to empty. ArrTags continues to read
  metadata from independently configured Sonarr and Radarr instances and
  publish configurable badges onto Jellyfin Movie and Episode posters through
  Jellyfin's supported item-image APIs while preserving the original poster.
