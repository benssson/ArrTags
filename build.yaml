version: "1.1.0.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Adds dashboard-configurable Sonarr and Radarr metadata badges to Jellyfin posters."
description: >
  ArrTags reads metadata from independently configured Sonarr and Radarr
  instances and publishes configurable badges (for example the actual file
  quality) onto Jellyfin Movie and Episode posters through Jellyfin's supported
  item-image APIs, preserving the original poster. It is configured from a
  dashboard settings page that applies most changes to the running plugin
  without a restart, supports a per-selector value allowlist and configurable
  badge size and position, bounds log verbosity with a secret-redaction
  contract, and caches each provider library so one read serves a reconciliation
  window.
category: "General"
owner: "arrtags"
artifacts:
  - "ArrTags.dll"
  - "ArrTags.deps.json"
changelog: >
  v1.1 adds a dashboard settings page that validates and applies most
  configuration changes to the running plugin without a host restart (an invalid
  change is rejected with the last valid configuration retained and recorded as
  a bounded, secret-free activity-log entry), a per-selector badge value
  allowlist, configurable badge size and position, bounded configurable log
  verbosity with a secret-redaction contract, and a bounded provider inventory
  cache that serves one library read per connection per reconciliation window
  with ArrTags-side invalidation. ArrTags continues to read metadata from
  independently configured Sonarr and Radarr instances and publish configurable
  badges onto Jellyfin Movie and Episode posters through Jellyfin's supported
  item-image APIs while preserving the original poster.
